<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบคลังรถยนต์ - ตารางตรงตาม Google Sheet</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Font Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
    th, td { whitespace: nowrap; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header Bar -->
  <header class="bg-blue-900 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-[98%] mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-800 p-2 rounded-lg border border-blue-700">
          <i data-lucide="car" class="w-6 h-6 text-blue-200"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">AutoStatus Fleet Tracker</h1>
          <p class="text-xs text-blue-200">แสดงผลคอลัมน์ตรงตาม Google Sheet (G - U)</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <button onclick="fetchSheetData()" class="flex items-center space-x-1.5 bg-blue-800 hover:bg-blue-700 text-blue-100 px-3 py-1.5 rounded-lg text-xs font-medium transition border border-blue-600">
          <i data-lucide="refresh-cw" class="w-4 h-4" id="refreshIcon"></i>
          <span>รีเฟรชข้อมูล</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-[98%] w-full mx-auto px-2 sm:px-4 py-4 space-y-4">

    <!-- Search Bar & Stats -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-4 items-center justify-between">
      <div class="relative w-full md:w-96">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input 
          type="text" 
          id="searchInput" 
          oninput="handleSearch()" 
          placeholder="ค้นหาข้อมูลทุกคอลัมน์..." 
          class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-600"
        >
      </div>
      <div class="flex items-center space-x-4 text-xs font-medium text-slate-600">
        <span>จำนวนทั้งหมด: <strong class="text-blue-900 text-sm" id="totalCount">0</strong> คัน</span>
        <span>|</span>
        <span id="lastUpdated">อัปเดตล่าสุด: -</span>
      </div>
    </div>

    <!-- Table Container -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-blue-900 text-white font-semibold border-b border-blue-950">
              <th class="py-3 px-3 border-r border-blue-800">Location</th>
              <th class="py-3 px-3 border-r border-blue-800">วันซื้อเข้า</th>
              <th class="py-3 px-3 border-r border-blue-800">ยี่ห้อ</th>
              <th class="py-3 px-3 border-r border-blue-800">รุ่น</th>
              <th class="py-3 px-3 border-r border-blue-800">รุ่นย่อย</th>
              <th class="py-3 px-3 border-r border-blue-800">สี</th>
              <th class="py-3 px-3 border-r border-blue-800">ทะเบียน</th>
              <th class="py-3 px-3 border-r border-blue-800">ทะเบียนขาย</th>
              <th class="py-3 px-3 border-r border-blue-800">เครื่องยนต์</th>
              <th class="py-3 px-3 border-r border-blue-800">ปีผลิต</th>
              <th class="py-3 px-3 border-r border-blue-800">ปีจด</th>
              <th class="py-3 px-3 border-r border-blue-800">ไมล์</th>
              <th class="py-3 px-3 border-r border-blue-800">ประวัติรถ</th>
              <th class="py-3 px-3 border-r border-blue-800">สถานะ</th>
              <th class="py-3 px-3">การรับประกัน</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100">
            <!-- Data Rows -->
          </tbody>
        </table>
      </div>
      <div id="emptyState" class="hidden p-8 text-center text-slate-400 text-xs">
        ไม่พบข้อมูล
      </div>
    </div>
  </main>

  <script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwpIga61uRTPrrHjRkB8MPK0mp_b1CNS-7M_c_p1NFz5js0eaF5-7o8Irsgjw6LsK0/exec";
    let rawData = [];

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      fetchSheetData();
    });

    async function fetchSheetData() {
      const refreshIcon = document.getElementById('refreshIcon');
      if (refreshIcon) refreshIcon.classList.add('animate-spin');

      try {
        const res = await fetch(SCRIPT_URL);
        const json = await res.json();
        if (json && json.status === 'success' && Array.isArray(json.data)) {
          rawData = json.data;
          renderTable(rawData);
          document.getElementById('totalCount').textContent = rawData.length;
          document.getElementById('lastUpdated').textContent = `อัปเดตล่าสุด: ${new Date().toLocaleTimeString('th-TH')}`;
        }
      } catch (err) {
        console.error("Fetch Error:", err);
      } finally {
        if (refreshIcon) refreshIcon.classList.remove('animate-spin');
      }
    }

    function getVal(row, possibleKeys) {
      if (!row) return '-';
      const keys = Object.keys(row);
      for (const pKey of possibleKeys) {
        const foundKey = keys.find(k => k.trim().toLowerCase() === pKey.trim().toLowerCase());
        if (foundKey && row[foundKey] !== undefined && row[foundKey] !== '') {
          return row[foundKey];
        }
      }
      return '-';
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      const emptyState = document.getElementById('emptyState');
      tbody.innerHTML = '';

      if (data.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      data.forEach((row, index) => {
        const tr = document.createElement('tr');
        tr.className = index % 2 === 0 ? 'bg-white hover:bg-blue-50/50' : 'bg-slate-50/50 hover:bg-blue-50/50';

        const locationVal = getVal(row, ['Location', 'สถานที่']);
        const buyDate = getVal(row, ['วันซื้อเข้า', 'วันซื้อ']);
        const brand = getVal(row, ['ยี่ห้อ']);
        const model = getVal(row, ['รุ่น']);
        const subModel = getVal(row, ['รุ่นย่อย']);
        const color = getVal(row, ['สี']);
        const license = getVal(row, ['ทะเบียน']);
        const salesLicense = getVal(row, ['ทะเบียนขาย']);
        const engine = getVal(row, ['เครื่องยนต์']);
        const prodYear = getVal(row, ['ปีผลิต']);
        const regYear = getVal(row, ['ปีจด']);
        const mileage = getVal(row, ['ไมล์', 'เลขไมล์']);
        const history = getVal(row, ['ประวัติรถ', 'ประวัติ']);
        const status = getVal(row, ['สถานะ']);
        const warranty = getVal(row, ['การรับประกัน', 'ประกัน']);

        // Format Status Badge
        let statusBadgeClass = 'bg-slate-100 text-slate-700 border-slate-200';
        if (status === 'วางขาย') statusBadgeClass = 'bg-emerald-100 text-emerald-800 border-emerald-300';
        if (status === 'จอง') statusBadgeClass = 'bg-amber-100 text-amber-800 border-amber-300';

        tr.innerHTML = `
          <td class="py-2.5 px-3 border-r border-slate-200 text-slate-700 font-medium">${locationVal}</td>
          <td class="py-2.5 px-3 border-r border-slate-200 text-slate-600">${buyDate}</td>
          <td class="py-2.5 px-3 border-r border-slate-200 font-semibold text-slate-800">${brand}</td>
          <td class="py-2.5 px-3 border-r border-slate-200 font-medium text-blue-900">${model}</td>
          <td class="py-2.5 px-3 border-r border-slate-200 text-slate-600">${subModel}</td>
          <td class="py-2.5 px-3 border-r border-slate-200 text-slate-600">${color}</td>
          <td class="py-2.5 px-3 border-r border-slate-200 font-bold text-blue-700">${license}</td>
          <td class="py-2.5 px-3 border-r border-slate-200 text-slate-600">${salesLicense}</td>
          <td class="py-2.5 px-3 border-r border-slate-200 text-slate-600">${engine}</td>
          <td class="py-2.5 px-3 border-r border-slate-200 text-slate-600">${prodYear}</td>
          <td class="py-2.5 px-3 border-r border-slate-200 text-slate-600">${regYear}</td>
          <td class="py-2.5 px-3 border-r border-slate-200 text-slate-700 font-medium">${mileage !== '-' ? Number(mileage.replace(/,/g, '')).toLocaleString() : '-'}</td>
          <td class="py-2.5 px-3 border-r border-slate-200 text-slate-600 max-w-xs truncate" title="${history}">${history}</td>
          <td class="py-2.5 px-3 border-r border-slate-200">
            <span class="px-2 py-0.5 rounded text-[11px] font-semibold border ${statusBadgeClass}">${status}</span>
          </td>
          <td class="py-2.5 px-3 text-slate-600">${warranty}</td>
        `;
        tbody.appendChild(tr);
      });
      lucide.createIcons();
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) {
        renderTable(rawData);
        return;
      }
      const filtered = rawData.filter(row => {
        return Object.values(row).some(v => String(v).toLowerCase().includes(q));
      });
      renderTable(filtered);
    }
  </script>
</body>
</html>
